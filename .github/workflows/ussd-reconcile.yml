name: USSD payment reconcile

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile pending USSD payments
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.gettikiti.com/api/ussd/reconcile)
          echo "HTTP $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ]
